# Builds hwcast-gcb200.exe on a GitHub-hosted Windows runner and drafts a release.
# Run it by pushing a tag (git tag v0.1.0 && git push origin v0.1.0). Releases are drafts for review.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --locked

      - name: Build release assets
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Draft GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release create $tag dist/hwcast-gcb200.exe dist/SHA256SUMS.txt `
            --draft --verify-tag --title "hwcast-gcb200 $($tag.TrimStart('v'))" `
            --notes "Built by GitHub Actions from $tag. Install hwcast first, then download hwcast-gcb200.exe and double-click it."

      - name: Keep the assets on manual runs
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: hwcast-gcb200-release
          path: dist/
